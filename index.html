<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
	<title>Dashboard</title>

  	<style>
		body{
			margin:0;
			font-family:'Montserrat',sans-serif;
			background:#f3f5f8;
		}
		
		#main{
			display:flex;
			align-items:flex-start;
		}

		#content{
			flex:1;
			min-width:0;
			width:100%;
			transition:.25s;
		}

		.filter-block{
    			margin-top:30px;
		}

		.title{
    			margin-bottom:12px;
    			font-size:13px;
    			font-weight:700;
    			text-transform:uppercase;
    			color:#666;
		}

		.ts-wrapper{
    			width:100%;
		}

		.ts-control{
			display:flex;
    			align-items:center;
    			min-height:60px !important;
    			padding:0 !important;
    			border:none !important;
    			box-shadow:none !important;
    			background:#fff !important;
		}

		.ts-control .item{
    			width:100%;
    			font-size:54px;
    			font-weight:800;
    			text-align:center;
    			text-transform:uppercase;
    			letter-spacing:1px;
		}

		.ts-dropdown .option{
    			padding:10px 16px;
    			font-size:14px;
		}

		#teamLine{
    			width:100%;
    			height:12px;
    			transition:.3s;
		}

		/* ---------- BOTONS ---------- */
		.toggle-btn{
    			width:100%;
    			margin-bottom:8px;
    			padding:10px;
    			border:1px solid #d0d0d0;
    			border-radius:8px;
    			background:#fff;
    			cursor:pointer;
    			transition:.2s;
		}

		.toggle-btn.active{
    			background:#1976d2;
    			border-color:#1976d2;
    			color:#fff;
    			font-weight:700;
		}

		/* ---------- TARGETES JUGADORS ---------- */
		#playerCards{
    			display:flex;
    			gap:20px;
			margin-top:20px;
    			margin-bottom:15px;
		}

		.player-card{
    			flex:1;
    			min-width:0;
    			padding:18px;
    			box-sizing:border-box;
    			background:#fff;
    			border-radius:12px;
    			box-shadow:0 4px 10px rgba(0,0,0,.12);
    			cursor:pointer;
    			transition:transform .15s, box-shadow .2s, background-color .2s, border-color .2s;
			border:3px solid transparent;
			box-sizing:border-box;
		}

		.player-card:hover{
			transform:translateY(-3px);
		}

		.player-card.selected{
    			transform:none;
    			box-shadow: 0 10px 24px rgba(0,0,0,.20), 0 3px 8px rgba(0,0,0,.12);
		}

		.player-card.selected{
    			background:#1976d2;
    			border:3px solid #1976d2;
    			color:#fff;
		}

		.player-card.selected .player-stat, 
		.player-card.selected .player-role,
		.player-card.selected .player-usage{
    			color:#fff;
		}

		.player-number{
   			font-size:40px;
    			font-weight:800;
    			line-height:1;
		}

		.player-name{
    			margin-top:12px;
    			font-size:20px;
    			font-weight:700;
		}	

		.player-stat{
    			margin-top:8px;
			color:#666;
		}

		.player-usage{
    			margin-top:14px;
    			font-weight:500;
    			color:#666;
		}

		.player-role{
    			margin-top:18px;
    			min-height:20px;
    			font-weight:bold;
    			color:#1976d2;
		}

		/* ---------- CONTENIDORS ---------- */
		#rankings{
			width:100%;
			display:grid;
			grid-template-columns:repeat(3,minmax(0,1fr));
			gap:25px;
		}

		.ranking-column{
    			width:100%;
    			box-sizing:border-box;
			padding:18px;
    			background:#fff;
    			border-radius:14px;
    			box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		#shotChartContainer{
			flex:3;
			min-width:0;
			padding:20px;
			background:#fff;
			border-radius:14px;
			box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		/* ---------- RANKINGS ---------- */
		.ranking-title-row{
    			display:flex;
    			justify-content:space-between;
    			align-items:center;
    			margin-bottom:20px;
		}

		.ranking-title{
    			margin:0;
    			font-size:22px;
    			font-weight:800;
		}

		.ranking-extra{
    			font-size:16px;
    			font-weight:700;
			color:#777;
		}

		.ranking-subtitle{
    			margin:-12px 0 18px;
    			font-size:16px;
    			font-weight:600;
    			color:#777;
		}

		.rank-card{
    			display:flex;
    			align-items:center;
    			margin-bottom:14px;
    			padding:14px 18px;
    			background:#f7f8fa;
    			border-radius:12px;
		}

		.rank-card.highlight,
		.rank-card.linked{
    			background:#dfefff;
    			border:2px solid #1976d2;
    			transform:scale(1.02);
		}

		.rank-position{
    			width:60px;
    			flex-shrink:0;
    			font-size:44px;
    			font-weight:800;
    			line-height:1;
    			text-align:center;
    			color:#d3d3d3;
		}

		.rank-info{
    			flex:1;
    			margin-left:10px;
		}

		.rank-player{
    			font-size:17px;
    			font-weight:700;
		}

		.rank-shot{
    			margin-top:2px;
    			font-size:22px;
    			font-weight:800;
		}

		.rank-stats{
   			margin-top:8px;
    			font-size:13px;
			color:#888;
		}

		#sidebar{
    			width:300px;
    			min-width:300px;
    			min-height:calc(100vh - 72px);

			padding:20px;
			margin-right:20px;   /* separació del contingut */
    			box-sizing:border-box;
    			overflow-y:auto;

			background:#fff;
    			box-shadow:0 0 20px rgba(0,0,0,.15);

			transition:width .25s ease,
               			min-width .25s ease,
               			padding .25s ease;
		}
		
		#sidebar.collapsed{
			width:48px;
			min-width:48px;
			background:#fff;
			margin-right:20px;   /* separació del contingut */
    			border-right:1px solid #ddd;
			box-shadow:2px 0 10px rgba(0,0,0,.08);
		}

		#toggleSidebar{

			position:absolute;

			top:75px;
			left:270px;

			width:24px;
    			height:40px;

			border:none;
    			background:transparent;
    			color:#666;
    			font-size:22px;
    			font-weight:bold;

    			cursor:pointer;
    			transition:left .25s ease, color .2s, opacity .15s ease;
    			z-index:1000;
		}

		#sidebar.collapsed + #content{
    			margin-left:0;
		}

		#toggleSidebar:hover{
    			color:#1976d2;
		}

		#sidebar.collapsed .filter-block{
    			opacity:0;
    			visibility:hidden;
    			pointer-events:none;
		}

		.filter-block{
    			transition:opacity .15s;
		}

		#shotArea{
			display:flex;
			width:100%;
			gap:20px;
			margin:40px 0;
		}
		
		#shotChartContainer{
			display:flex;
			gap:20px;

			margin:40px 0;
			padding:20px;

			background:#fff;
    			border-radius:14px;
	    		box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		#shotChartWrapper{
			flex:1;
			min-width:0;
		}

		#shotLegend{
			width:300px;
			flex-shrink:0;

			display:flex;
			flex-direction:column;
			gap:8px;
		}

		#shotChart{
			width:100%;
			height:auto;
		}
		.shot-type-card{
			display:flex;
    			align-items:center;
    			justify-content:center;

    			border-radius:8px;

    			background:#ececec;

    			font-size:13px;
    			font-weight:700;
    			text-align:center;

			min-height:42px;
		}
  	</style>
</head>

const supabase = createClient
	("https://lpcizczmkzznbtqptqll.supabase.co", 
	"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxwY2l6Y3pta3p6bmJ0cXB0cWxsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NjAwMDAsImV4cCI6MjA5OTIzNjAwMH0.dJIsKC4cJfjVxVQmQcAebdXxghiYo0AShV5lZDN5ebs");

let selectedTeam = "";
let rankingFilter = "teamData";
let transitionFilter = "all";
let showRankingStats = false;
let selectedRanking = null;
let selectedFocus = null;
let teams = [];
let selectedCompetitions = new Set();
let selectedRounds = new Set();
let currentActions = [];
let currentPlayers = [];
let selectedPlayers = new Set();
let selectedRankCard = null;
let lockedRankKey = null;
let selectedShotType = null;
const SHOT_ORDER = ["PnR handler", "PnR roller", "PnR roll seal", "PnPop", "Flare", "Pindown", "Interior", "Screener", "HO catcher", "HO giver", "Iso", "Low post", "Iso 		seal", "FB 2", "FB closeout", "FB seal", "CnShoot", "CnDrive", "Cut", "Putback", "Misc"];

function renderShotLegend(){

	const legend = document.getElementById("shotLegend");
	legend.innerHTML = "";

	const rows = [
		["PnR handler", "PnR roller", "PnR roll seal", "PnPop"],
		["Flare", "Pindown", "Interior", "Screener"],
		["FB 2", "FB closeout", "FB seal"],
		["Iso", "Low post", "Iso seal"],
		["HO giver", "HO catcher"],
		["Putback", "Cut", "Misc"],
		["CnShoot", "CnDrive"]
	];

	rows.forEach(row => {

		const rowDiv = document.createElement("div");

		rowDiv.style.display = "grid";
		rowDiv.style.gridTemplateColumns = "repeat(4, 1fr)";
		rowDiv.style.gap = "8px";

		row.forEach(type => {

			const card = document.createElement("div");
			card.className = "shot-type-card";
			card.textContent = type;

			if(selectedShotType === type){
				card.style.background = "#1976d2";
				card.style.color = "white";
			}

			card.style.cursor = "pointer";
		
			card.onclick = () => {

				if(selectedShotType === type){
					selectedShotType = null;
				}else{
					selectedShotType = type;
				}

				renderRankings();
				renderShotLegend(); // actualitza el color seleccionat
			};

			rowDiv.appendChild(card);
		});

		legend.appendChild(rowDiv);
	});
}

/* --------------------------- CARREGAR EQUIPS ---------------------------- */
async function loadTeams() {
	const { data, error } = await supabase
		.from("teams")
    		.select(`*`)
    		.limit(200);

	if (error) {
		console.error(error);
   		return;
 	}

	teams = data.map(team => ({
		uuid: team.uuid,
    		name: team.name,
    		color: team.color
  	}));

	teams.sort((a, b) => {
		const nameA = a.name.toUpperCase();
    		const nameB = b.name.toUpperCase();

	    	if (nameA === "BARCELONA") return -1;
		if (nameB === "BARCELONA") return 1;

	    	if (nameA === "MATARÓ") return nameB === "BARCELONA" ? 1 : -1;
   		if (nameB === "MATARÓ") return nameA === "BARCELONA" ? -1 : 1;

		return nameA.localeCompare(nameB, "es");
	});

	const barcelona = teams.find(t => t.name.toUpperCase() === "BARCELONA");

	if(barcelona){
    		selectedTeam = barcelona.uuid;
	}

	renderTeamToggles(teams);
}


function updateActionButtons(){

	document
        	.querySelectorAll("#allActions,#onlyCheckballs,#onlyTrans")
        	.forEach(b=>b.classList.remove("active"));

    	if(transitionFilter==="all")
        	document.getElementById("allActions").classList.add("active");

    	if(transitionFilter==="check")
        	document.getElementById("onlyCheckballs").classList.add("active");

    	if(transitionFilter==="nocheck")
        	document.getElementById("onlyTrans").classList.add("active");

}

function renderShotChart(data){

	const svg = document.getElementById("shotChart");
	svg.innerHTML="";

	if (!chartWidth) {
		chartWidth = document.getElementById("shotChartWrapper").clientWidth;
	}

	const width = chartWidth;

	const baseline = 260;
	const maxHeight = 180;
	const maxPPA =2.0;
	let currentX = 0;

	const orderedData = SHOT_ORDER.map(type => {
		return data.find(x => x.type === type) || {type, attempts:0, points:0, usage:0, ppa:0, tov:0};
	});

	const topY = 10;
	const topHeight = 12;

	const yTicks = [0.5,1,1.5,2];
	yTicks.forEach(value=>{
		const y = baseline - value/maxPPA*maxHeight;
		const line = document.createElementNS("http://www.w3.org/2000/svg", "line");

		line.setAttribute("x1",0);
    		line.setAttribute("x2",width);

		line.setAttribute("y1",y);
		line.setAttribute("y2",y);

		line.setAttribute("stroke","#ddd");
    		line.setAttribute("stroke-dasharray","5 5");

		svg.appendChild(line);

		const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
		
		label.setAttribute("x",-10);
    		label.setAttribute("y",y+5);

		label.setAttribute("text-anchor","end");

		label.textContent=value.toFixed(1);

		svg.appendChild(label);

	});

	const axis = document.createElementNS("http://www.w3.org/2000/svg", "line");
	
	axis.setAttribute("x1",0);
	axis.setAttribute("x2",width);

	axis.setAttribute("y1",baseline);
	axis.setAttribute("y2",baseline);

	axis.setAttribute("stroke","#444");
	axis.setAttribute("stroke-width","2");

	svg.appendChild(axis);

	orderedData.forEach(s=>{
		const w = s.usage*width;
		const h = s.ppa/maxPPA*maxHeight;

		const x = currentX;
		const y = baseline-h;

		const topRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");

		topRect.setAttribute("x", currentX);
		topRect.setAttribute("y", topY);
		topRect.setAttribute("width", w);
		topRect.setAttribute("height", topHeight);
		topRect.setAttribute("fill", selectedShotType === s.type ? "#1976d2" : "#d9d9d9");
		topRect.setAttribute("stroke", "white");
		topRect.style.cursor = "pointer";

		//------------ Rectangle -----------
		const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
		
		rect.setAttribute("x",x);
        	rect.setAttribute("y",y);

        	rect.setAttribute("width",w);
	        rect.setAttribute("height",h);

	        rect.setAttribute("fill","#1976d2");
	        rect.setAttribute("stroke","white");
		rect.style.cursor = "pointer";

		rect.onclick = () => {
			if(selectedShotType === s.type){
				selectedShotType = null;
    			}else{
        			selectedShotType = s.type;
    			}

			renderRankings();
    			renderShotLegend();
		};

		topRect.onclick = rect.onclick;

		svg.appendChild(topRect);

	        svg.appendChild(rect);

	        //------------ Text -----------
		const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
		
		text.setAttribute("x", x+w/2);
		text.setAttribute("y", y+h/2);

		text.setAttribute("text-anchor", "middle");
		text.setAttribute("dominant-baseline", "middle");
		
		text.setAttribute("font-size", "15");
		text.setAttribute("fill", "white");

	        text.textContent = s.type;
		svg.appendChild(text);
		currentX += w;
	});
	svg.setAttribute("viewBox",`0 0 ${width} 300`);
	svg.setAttribute("width","100%");
}


function initActionButtons(){

	const buttons = {allActions: "all", onlyCheckballs: "1", onlyTrans: "0"};

	Object.entries(buttons).forEach(([id,value])=>{
		const btn=document.getElementById(id);
		btn.onclick=()=>{
			transitionFilter=value;

			Object.keys(buttons).forEach(x=> document.getElementById(x).classList.remove("active"));
			
            		btn.classList.add("active");

			renderPlayerCards(currentPlayers);
            		renderRankings();
		};
	});

	document.getElementById("allActions").classList.add("active");
}


function renderTeamToggles(teams) {

	const container = document.getElementById("teamToggles");
	container.innerHTML = "";

	const select = document.createElement("select");
    	select.className = "team-select";

	teams.forEach(team => {
		const option = document.createElement("option");
		option.value = team.uuid;
		option.textContent = team.name;

	        if (team.uuid === selectedTeam) {
        	    option.selected = true;
        	}

	        select.appendChild(option);
	});

	container.appendChild(select);

	const ts = new TomSelect(select,{
        	controlInput:null,
    		create:false,
    		searchField:[],
    		onChange(value){

			selectedTeam = value;

			// Reiniciar estat
    			selectedRanking = null;
    			selectedFocus = null;
    			lockedRankKey = null;

			// Treure qualsevol jugador seleccionat
			selectedPlayers.clear();
			selectedShotType = null;

			// Tornar als filtres per defecte
    			transitionFilter = "all";
    			rankingFilter = "teamData";

			// Eliminar competicions i rondes seleccionades
    			selectedCompetitions.clear();
    			selectedRounds.clear();

			const team = teams.find(t => t.uuid === value);

			if(team){
        			document.getElementById("teamLine").style.backgroundColor = team.color;
        			loadData();
    			}
		}
    	});

	ts.on("dropdown_open", () => {
		btn.style.opacity = "0";
		btn.style.pointerEvents = "none";
	});

	ts.on("dropdown_close", () => {
    		btn.style.opacity = "1";
    		btn.style.pointerEvents = "auto";
	});

	ts.setValue(selectedTeam || teams[0].uuid);
}


/* ---------------------------
   CARREGAR ACTIONS
---------------------------- */
async function loadData() {
	let query = supabase
		.from("actions")
		.select(`
        		*,
        		game:games!actions_game_uuid_fkey!inner(
            			game_date,
            			round,
            			home_team_uuid,
            			away_team_uuid,
            			home_team:teams!games_home_team_uuid_fkey(uuid, name),
            			away_team:teams!games_away_team_uuid_fkey(uuid, name),
            			competition:competitions!games_competition_uuid_fkey(name)
        		),
			team:teams!actions_team_uuid_fkey(uuid,	name),
		        player:players!actions_player_uuid_fkey(uuid, name, shirt_number),
		        home_lineup:lineups!actions_home_lineup_uuid_fkey(
            			player1:players!lineups_player_1_uuid_fkey(uuid,name),
            			player2:players!lineups_player_2_uuid_fkey(uuid,name),
            			player3:players!lineups_player_3_uuid_fkey(uuid,name)
        		),
        		away_lineup:lineups!actions_away_lineup_uuid_fkey(
            			player1:players!lineups_player_1_uuid_fkey(uuid,name),
				player2:players!lineups_player_2_uuid_fkey(uuid,name),
            			player3:players!lineups_player_3_uuid_fkey(uuid,name)
        		)
    		`)
		.or(`home_team_uuid.eq.${selectedTeam},away_team_uuid.eq.${selectedTeam}`, { foreignTable: "game" }
    	);

	const pageSize = 1000;
	let from = 0;
	let data = [];
	
	while (true) {
		const { data: page, error } = await query.range(from, from + pageSize - 1);

		if (error) {
			console.error(error);
			document.getElementById("status").innerText = "Error carregant dades";
        		return;
    		}

		data.push(...page);

		// Si s'han retornat menys de 1000 registres, ja hem acabat
		if (page.length < pageSize) break;
		from += pageSize;
	}

	const clean = data.map(r => ({
		...r,
		home_team_uuid: r.game?.home_team?.uuid,
    		home_team_name: r.game?.home_team?.name,
    		away_team_uuid: r.game?.away_team?.uuid,
    		away_team_name: r.game?.away_team?.name,
    		competition_name: r.game?.competition?.name,
    		game_date: r.game?.game_date,
    		action_team_uuid: r.team?.uuid,
    		action_team_name: r.team?.name,
    		action_player_uuid: r.player?.uuid,
    		action_player_name: r.player?.name,
    		home_player_1_uuid: r.home_lineup?.player1?.uuid,
    		home_player_1_name: r.home_lineup?.player1?.name,
    		home_player_2_uuid: r.home_lineup?.player2?.uuid,
    		home_player_2_name: r.home_lineup?.player2?.name,
    		home_player_3_uuid: r.home_lineup?.player3?.uuid,
    		home_player_3_name: r.home_lineup?.player3?.name,
    		away_player_1_uuid: r.away_lineup?.player1?.uuid,
    		away_player_1_name: r.away_lineup?.player1?.name,
    		away_player_2_uuid: r.away_lineup?.player2?.uuid,
    		away_player_2_name: r.away_lineup?.player2?.name,
    		away_player_3_uuid: r.away_lineup?.player3?.uuid,
    		away_player_3_name: r.away_lineup?.player3?.name,
    		round_block: r.game?.round === "1" || r.game?.round === "2" || r.game?.round === "3" ? "Grupos" : r.game?.round,
    		points: r.action_result === "1+" || r.action_result === "1+PF" || r.action_result === "FT+" ? 1 : (r.action_result === "2+" || r.action_result === "2+PF" ? 2 : 0)
  	}));

	currentActions = clean;

	if (!selectedTeam && teams.length > 0) selectedTeam = teams[0].uuid;
	console.log(currentActions);
	await loadPlayers();

	renderCompetitionFilters();
	renderRoundFilters();
	renderRankings();
	renderPlayerCards(currentPlayers);
	updateActionButtons();

	document.getElementById("allActions").onclick = () => {
		transitionFilter = "all";
    		updateActionButtons();
    		renderRankings();
	};

	document.getElementById("onlyCheckballs").onclick = () => {
		transitionFilter = "check";
		updateActionButtons();
   		renderRankings();
	};

	document.getElementById("onlyTrans").onclick = () => {
		transitionFilter = "nocheck";
    		updateActionButtons();
    		renderRankings();
	};

	updateActionButtons();
}


async function loadPlayers(){

	const {data,error}=await supabase
        	.from("players")
        	.select("*")
        	.eq("team_uuid",selectedTeam)
        	.order("shirt_number");

	if(error){
        	console.error(error);
        	return;
    	}

	currentPlayers = data;
	renderPlayerCards(currentPlayers);
}


function getPoints(result){

	switch(result){
		case "1+":
        	case "1+PF":
        	case "FT+":
        		return 1;

	        case "2+":
        	case "2+PF":
            		return 2;

	        default:
        		return 0;

	}
}


function renderPlayerCards(players){

	const container = document.getElementById("playerCards");
    	container.innerHTML = "";

	// Estadístiques acumulades per jugador
    	const stats = {};

	currentActions.forEach(a => {
		if(!stats[a.action_player_uuid]){
			stats[a.action_player_uuid] = {games: new Set(), points: 0};
		}

	        stats[a.action_player_uuid].games.add(a.game_uuid);
        	stats[a.action_player_uuid].points += a.points ?? 0;
	});

	const teamActions = currentActions.filter(a =>
		a.action_team_uuid === selectedTeam &&
    		a.action_type &&
    		!a.action_type.startsWith("REBOUND") &&
    		!a.action_type.startsWith("FOUL") &&
    		!a.action_type.startsWith("FREE THROW")
	);

	players.slice(0,6).forEach(player=>{
		const s = stats[player.uuid] || {games:new Set(), points:0};
		
		const onCourtActions = teamActions.filter(a => {
			if (a.home_team_uuid === selectedTeam) {
				return a.home_player_1_uuid === player.uuid ||
					a.home_player_2_uuid === player.uuid ||
					a.home_player_3_uuid === player.uuid;
    			}

			return a.away_player_1_uuid === player.uuid ||
           			a.away_player_2_uuid === player.uuid ||
           			a.away_player_3_uuid === player.uuid;

		});
	
		const playerShots = onCourtActions.filter(a => a.action_player_uuid === player.uuid).length;

		const usage = onCourtActions.length ? (100 * playerShots / onCourtActions.length).toFixed(1) : "0.0";
        	const games = s.games.size;
	        const ppg = games ? (s.points / games).toFixed(1) : "0.0";
	
		const card = document.createElement("div");

	        card.className = "player-card";

	        card.innerHTML = `
        		<div class="player-number">#${player.shirt_number ?? ""}</div>
			<div class="player-name">${player.name}</div>
			<div class="player-stat">${games} ${games === 1 ? "partido" : "partidos"}</div>
			<div class="player-stat">${ppg} puntos / partido</div>
			<div class="player-usage">USG ${usage}%</div>
			<div class="player-role">&nbsp;</div>
        	`;

	        card.onclick = () => {
			const color = teams.find(t => t.uuid === selectedTeam)?.color || "#1976d2";
	
			if(selectedPlayers.has(player.uuid)){
    				selectedPlayers.delete(player.uuid);
    				card.classList.remove("selected");
    				card.style.background = "";
    				card.style.borderColor = "";
			}else{
    				selectedPlayers.add(player.uuid);
    				card.classList.add("selected");
    				card.style.background = color;
    				card.style.borderColor = color;
			}	
			renderRankings();

		};
		container.appendChild(card);
	});
}


function renderCompetitionFilters(){

	const container = document.getElementById("competitionFilters");
	container.innerHTML="";

	const competitions=[...new Set(currentActions.map(a=>a.competition_name))].sort();

	selectedCompetitions.clear();

	competitions.forEach(comp=>selectedCompetitions.add(comp));
	competitions.forEach(comp=>{
		const label=document.createElement("label");
		label.innerHTML=`
			<input type="checkbox" checked value="${comp}">${comp}`;
			
		label.querySelector("input").onchange=e=>{
			if(e.target.checked) selectedCompetitions.add(comp);
            		else selectedCompetitions.delete(comp);
			
			renderRoundFilters();
			renderRankings();
        	};
		
		container.appendChild(label);
       		container.appendChild(document.createElement("br"));
	});
}


function renderRoundFilters(){

    	const container=document.getElementById("roundFilters");
    	container.innerHTML="";

	const rounds=[...new Set(currentActions.filter(a=> selectedCompetitions.has(a.competition_name)).map(a=>a.round_block))].sort();
	
	selectedRounds.clear();

	rounds.forEach(r=>selectedRounds.add(r));
	rounds.forEach(round=>{
		const label=document.createElement("label");
		label.innerHTML=`
			<input type="checkbox" checked value="${round}">${round}`;

	        label.querySelector("input").onchange=e=>{
			if(e.target.checked) selectedRounds.add(round);
            		else selectedRounds.delete(round);

			renderRankings();
		};

	        container.appendChild(label);
        	container.appendChild(document.createElement("br"));
	});
}


function getFilteredActions(){
	return currentActions.filter(a => selectedCompetitions.has(a.competition_name) && selectedRounds.has(a.round_block));
}


function calculateShotStats(actions, applyShotFilter=true){

	const playerStats = {};
    	const shotStats = {};

	const totalGames = new Set(actions.map(a => a.game_uuid)).size;

	actions.forEach(a=>{
		if(applyShotFilter && selectedShotType && a.action_type !== selectedShotType) return;
		if(!a.action_type) return;
		if(a.action_team_uuid !== selectedTeam) return;
		if(!a.action_player_name) return;
		if(a.action_type.includes("REBOUND")) return;
        	if(a.action_type.includes("FOUL")) return;
        	if(a.action_type.includes("FREE THROW")) return;
	        if(transitionFilter==="check" && a.checkball!=1) return;
	        if(transitionFilter==="nocheck" && a.checkball!=0) return;
	        if(selectedPlayers.size && !selectedPlayers.has(a.action_player_uuid)) return;

	        let type = a.action_type;
	        const playerKey = a.action_player_name + "|||" + type;

	        if(!playerStats[playerKey]){
			playerStats[playerKey]={player:a.action_player_name, type, attempts:0, turnovers:0, points:0};
		}
		
		if(!shotStats[type]){
			shotStats[type]={type, attempts:0, turnovers:0, points:0};
		}

		const p = playerStats[playerKey];
        	const s = shotStats[type];

		if(a.action_result==="TO"){
			p.turnovers++;
			s.turnovers++;
		}else{
			p.attempts++;
            		s.attempts++;
		}
	
		const pts = getPoints(a.action_result);	
		p.points += pts;
        	s.points += pts;
	});

    	const playerValues = Object.values(playerStats);
	const totalAttempts = playerValues.reduce((x,y)=>x+y.attempts,0);

	playerValues.forEach(v=>{
		v.usage = totalAttempts ? v.attempts/totalAttempts : 0;
		v.ppa = v.attempts ? v.points/v.attempts : 0;
		v.tov = v.attempts+v.turnovers ? v.turnovers/(v.attempts+v.turnovers) : 0;
		v.attemptsPerGame = totalGames ? v.attempts/totalGames : 0;
		v.rankTotal = v.usage*v.ppa;
	});

	const usage = [...playerValues].sort((a,b)=>b.usage-a.usage);
	const efficiency = [...playerValues].filter(v => selectedShotType || selectedPlayers.size>0 || transitionFilter!=="all" || v.attemptsPerGame>=1).sort((a,b)=>b.ppa-a.ppa);
	const combined = [...playerValues].filter(v => selectedShotType || selectedPlayers.size>0 || transitionFilter!=="all" || v.attemptsPerGame>=1).sort((a,b)=>b.rankTotal-a.rankTotal);
	
	const shotValues = Object.values(shotStats);
	const totalShotAttempts = shotValues.reduce((x,y)=>x+y.attempts,0);
	
	shotValues.forEach(v=>{
		v.usage = totalShotAttempts ? v.attempts/totalShotAttempts : 0;
		v.ppa = v.attempts ? v.points/v.attempts : 0;
		v.tov = v.attempts+v.turnovers ? v.turnovers/(v.attempts+v.turnovers) : 0;
	});

	return {usage, efficiency, combined, shotTypes:shotValues};
}


function renderRankings(){

	const actions = getFilteredActions();

	// dades completes sempre pel gràfic
	const chartStats = calculateShotStats(actions, false);
	renderShotChart(chartStats.shotTypes);


	// dades filtrades pel ranking
	const rankingStats = calculateShotStats(actions, true);


	const rankings = rankingStats;


	let attempts = 0;
	let points = 0;

	actions.forEach(a => {
		if(!a.action_type) return;
		if(a.action_type.startsWith("REBOUND")) return;
		if(a.action_type.startsWith("FOUL")) return;
		if(a.action_result.startsWith("TO")) return;

		if(transitionFilter === "check" && a.checkball != 1) return;
		if(transitionFilter === "nocheck" && a.checkball != 0) return;

		if(a.action_team_uuid !== selectedTeam) return;

		points += getPoints(a.action_result);
		attempts++;
	});

	const teamEfficiency = attempts ? points / attempts : 0;

	const container = document.getElementById("rankings");
	container.innerHTML="";

	createColumn(container, "TOP USAGE", rankings.usage, x=>(x.usage*100).toFixed(1)+" %");
	createColumn(container, "TOP EFICIENCIA", rankings.efficiency, x=>x.ppa.toFixed(2)+" pts/acc");
	createColumn(container, "TOP COMBINADO", rankings.combined, x=>"Score: "+x.rankTotal);
}


function createColumn(container,title,data,valueFunction,extraText=""){

	const col=document.createElement("div");
	col.className="ranking-column";
	col.innerHTML = `
		<div class="ranking-title-row">
    			<div class="ranking-title">${title}</div>
			${extraText ? `<div class="ranking-extra">${extraText}</div>` : ""}
		</div>		
	`;

	data.slice(0,5).forEach((row,index)=>{
		const card=document.createElement("div");
		card.className="rank-card";
		const rankKey = row.player + "|||" + row.type;
		card.dataset.rankKey = rankKey;
		card.dataset.player = row.player;
		card.dataset.type = row.type;

        	card.innerHTML = `
			<div class="rank-position">${index + 1}</div>
			<div class="rank-info">
				<div class="rank-player">${row.player}</div>
				<div class="rank-shot">${row.type}</div>
				<div class="rank-stats">USG ${(row.usage*100).toFixed(1)}% · ${row.ppa.toFixed(2)} pts/acc · TO% ${(row.tov*100).toFixed(1)}%</div>
			</div>
		`;

		card.onmouseenter = () => {
			if(!lockedRankKey) highlightRankCards(rankKey);
		};

		card.onmouseleave = () => {
			if(!lockedRankKey) clearRankCards();
		};

		card.onclick = () => {
			if(lockedRankKey === rankKey){
				lockedRankKey = null;
        			clearRankCards();
			}else{
				lockedRankKey = rankKey;
        			highlightRankCards(rankKey);
			}
		};

		col.appendChild(card);
    });

    container.appendChild(col);
}


function highlightRankCards(key){
	document.querySelectorAll(".rank-card").forEach(card=>{card.classList.toggle("highlight",card.dataset.rankKey === key);});
}


function clearRankCards(){
	document.querySelectorAll(".rank-card").forEach(c=>c.classList.remove("highlight"));
}


function highlightCards(player, type, active){
	document.querySelectorAll(".rank-card").forEach(card=>{
		const same = card.dataset.player === player && card.dataset.type === type;
		card.classList.toggle("linked", active && same);
	});
}
