<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
	<title>Dashboard</title>

  	<style>
		body{
			margin:0;
			font-family:'Montserrat',sans-serif;
			background:#f3f5f8;
		}
		
		#main{
			display:flex;
			align-items:flex-start;
		}

		#content{
			flex:1;
			min-width:0;
			transition:.25s;
		}

		.filter-block{
    			margin-top:30px;
		}

		.title{
    			margin-bottom:12px;
    			font-size:13px;
    			font-weight:700;
    			text-transform:uppercase;
    			color:#666;
		}

		.ts-wrapper{
    			width:100%;
		}

		.ts-control{
			display:flex;
    			align-items:center;
    			min-height:60px !important;
    			padding:0 !important;
    			border:none !important;
    			box-shadow:none !important;
    			background:#fff !important;
		}

		.ts-control .item{
    			width:100%;
    			font-size:54px;
    			font-weight:800;
    			text-align:center;
    			text-transform:uppercase;
    			letter-spacing:1px;
		}

		.ts-dropdown .option{
    			padding:10px 16px;
    			font-size:14px;
		}

		#teamLine{
    			width:100%;
    			height:12px;
    			transition:.3s;
		}

		/* ---------- BOTONS ---------- */
		.toggle-btn{
    			width:100%;
    			margin-bottom:8px;
    			padding:10px;
    			border:1px solid #d0d0d0;
    			border-radius:8px;
    			background:#fff;
    			cursor:pointer;
    			transition:.2s;
		}

		.toggle-btn.active{
    			background:#1976d2;
    			border-color:#1976d2;
    			color:#fff;
    			font-weight:700;
		}

		/* ---------- TARGETES JUGADORS ---------- */
		#playerCards{
    			display:flex;
    			gap:20px;
			margin-top:20px;
    			margin-bottom:15px;
		}

		.player-card{
			flex:0 0 calc((100% - 5 * 20px) / 6);
    			box-sizing:border-box;

			padding:18px;
    			background:#fff;
    			border-radius:12px;
			border:3px solid transparent;
    			box-shadow:0 4px 10px rgba(0,0,0,.12);
			cursor:pointer;
    			transition:transform .15s, box-shadow .2s, background-color .2s, border-color .2s;
		}

		.player-card:hover{
			transform:translateY(-3px);
		}

		.player-card.selected{
    			transform:none;
    			box-shadow: 0 10px 24px rgba(0,0,0,.20), 0 3px 8px rgba(0,0,0,.12);
		}

		.player-card.selected{
    			background:#1976d2;
    			border:3px solid #1976d2;
    			color:#fff;
		}

		.player-card.selected .player-summary, 
		.player-card.selected .player-role,
		.player-card.selected .player-summary-filtered{
    			color:#fff;
		}

		.player-number{
   			font-size:40px;
    			font-weight:800;
    			line-height:1;
		}

		.player-name{
			margin-top:12px;
			font-size:20px;
			font-weight:700;
			line-height:1.15;

			height:46px;          /* espai per dues línies */
			display:flex;
			align-items:flex-start;
			white-space:normal;
			overflow-wrap:break-word;
		}	

		.player-stat{
    			margin-top:8px;
			color:#666;
		}

		.player-usage{
    			margin-top:14px;
    			font-weight:500;
    			color:#666;
		}

		.player-role{
    			margin-top:18px;
    			min-height:20px;
    			font-weight:bold;
    			color:#1976d2;
		}

		/* ---------- CONTENIDORS ---------- */
		#rankings{
			width:100%;
			display:grid;
			grid-template-columns:repeat(3,minmax(0,1fr));
			gap:25px;
		}

		.ranking-column{
    			width:100%;
    			box-sizing:border-box;
			padding:18px;
    			background:#fff;
    			border-radius:14px;
    			box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		#shotChartContainer{
			flex:3;
			min-width:0;
			padding:20px;
			background:#fff;
			border-radius:14px;
			box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		/* ---------- RANKINGS ---------- */
		.ranking-title-row{
    			display:flex;
    			justify-content:space-between;
    			align-items:center;
    			margin-bottom:20px;
		}

		.ranking-title{
    			margin:0;
    			font-size:22px;
    			font-weight:800;
		}

		.ranking-extra{
    			font-size:16px;
    			font-weight:700;
			color:#777;
		}

		.ranking-subtitle{
    			margin:-12px 0 18px;
    			font-size:16px;
    			font-weight:600;
    			color:#777;
		}

		.rank-card{
    			display:flex;
    			align-items:center;
    			margin-bottom:14px;
    			padding:14px 18px;
    			background:#f7f8fa;
    			border-radius:12px;

		.rank-card.highlight,
		.rank-card.linked{

    			border:2px solid #1976d2;

		.rank-position{

    			flex-shrink:0;
    			font-size:44px;
    			font-weight:800;
    			line-height:1;
    			text-align:center;
    			color:#d3d3d3;
		}

		.rank-info{
    			flex:1;
    			margin-left:10px;
		}

		.rank-player{
    			font-size:17px;
    			font-weight:700;
		}

		.rank-shot{
    			margin-top:2px;
    			font-size:22px;
    			font-weight:800;
		}

		.rank-stats{
   			margin-top:8px;
    			font-size:13px;
			color:#888;
		}

		#sidebar{
    			width:300px;
    			min-width:300px;
    			min-height:calc(100vh - 72px);

			padding:20px;
			margin-right:20px;   /* separació del contingut */

    			overflow-y:auto;

			background:#fff;
    			box-shadow:0 0 20px rgba(0,0,0,.15);

			transition:width .25s ease,

		}
		
		#sidebar.collapsed{

			min-width:48px;
			background:#fff;
			margin-right:20px;   /* separació del contingut */

			box-shadow:2px 0 10px rgba(0,0,0,.08);

		#sidebar.collapsed .filter-block{
			display:none;
		}

		#toggleSidebar{

			top:75px;
			left:270px;

			width:24px;
    			height:40px;

			border:none;
    			background:transparent;
    			color:#666;
    			font-size:22px;
    			font-weight:bold;

    			cursor:pointer;
    			transition:left .25s ease, color .2s, opacity .15s ease;
    			z-index:1000;
		}

		#sidebar.collapsed + #content{

		}

		#toggleSidebar:hover{
    			color:#1976d2;
		}

		#sidebar.collapsed .filter-block{
    			opacity:0;
    			visibility:hidden;
    			pointer-events:none;
		}

		.filter-block{
    			transition:opacity .15s;
		}

			display:flex;
			width:100%;
			gap:20px;
			margin:40px 0;
		}
		
		#shotChartContainer{
			display:flex;
			gap:20px;

			margin:40px 0;
			padding:20px;

			background:#fff;
    			border-radius:14px;
	    		box-shadow:0 4px 10px rgba(0,0,0,.12);
		}

		#shotChartWrapper{
    			flex:0 0 70%;
    			min-width:0;
    			height:100%;
		}

		#shotLegend{
			flex:0 0 30%;
			flex-shrink:0;
			flex-direction:column;
			align-self:stretch;
			display:grid;
			grid-template-rows:repeat(7,1fr);
			gap:8px;
		}

		#shotChart{
			width:100%;
			height:100%;

		}
		.shot-type-card{

    			border-radius:8px;

    			background:#ececec;

    			font-size:13px;
    			font-weight:700;
    			text-align:center;

			padding:10px 14px;

			background:white;
    			border-radius:8px;

			font-size:13px;
    			line-height:1.5;

			pointer-events:none;
    			z-index:5000;

const SHOT_COLORS = {"PnR handler": "#0D47A1", "PnR roller": "#1976D2", "PnR roll seal": "#42A5F5", "PnPop": "#BBDEFB", "Flare": "#8B0000", "Pindown": "#D32F2F", "Interior": "#FF8A80", "Screener": "#FFEBEE", "HO catcher": "#D7CCC8", "HO giver": "#5D4037", "Iso": "#1B5E20", "Low post": "#4CAF50", "Iso seal": "#C8E6C9", "FB 2": "#E65100", "FB closeout": "#FB8C00", "FB seal": "#FFE0B2", "CnShoot": "#AD1457", "CnDrive": "#F8BBD0", "Cut": "#4A148C", "Putback": "#8E24AA", "Misc": "#E1BEE7"};

const LEAGUE_AVG_PPA = 0.9;
const LEAGUE_AVG_TOV = 0.15;

const USG_THRESHOLD = 0.10;
const PPA_HIGH = 0.71;
const PPA_LOW = 0.51;


function getTableCellColor(usage, ppa){

    // USG >= 10%
    if(usage >= USG_THRESHOLD){

        // Verd
        if(ppa >= PPA_HIGH){
            return "#C8E6C9";
        }

        // Groc
        if(ppa >= PPA_LOW && ppa < PPA_HIGH){
            return "#FFF9C4";
        }

        // Vermell
        if(ppa < PPA_LOW){
            return "#FFCDD2";
        }
    }

    // USG < 10% i PPA >= 1.1
    if(usage < USG_THRESHOLD && ppa >= PPA_HIGH){
        return "#BBDEFB";
    }

    // Resta de casos: sense color
    return "";
}


function hasHighTurnover(stats){

    if(!stats) return false;

    return stats.tov >= LEAGUE_AVG_TOV;
}


function calculateTableStats(actions){

    const playerStats = {};

    actions.forEach(a => {

        if(!a.action_type) return;
        if(!a.action_player_uuid) return;

        // Excloure accions que no són tirs/accions de tir
        if(a.action_type.startsWith("REBOUND")) return;
        if(a.action_type.startsWith("FOUL")) return;
        if(a.action_type.startsWith("FREE THROW")) return;

        // Filtre checkball
        if(transitionFilter === "check" && a.checkball != 1) return;
        if(transitionFilter === "nocheck" && a.checkball != 0) return;

        // ---------------------------
        // FILTRE DE DADES
        // ---------------------------

        if(rankingFilter === "playerData"){

            if(a.action_team_uuid !== selectedTeam){
                return;
            }

            if(
                selectedPlayers.size &&
                !selectedPlayers.has(a.action_player_uuid)
            ){
                return;
            }
        }

        else if(rankingFilter === "teamData"){

            if(a.action_team_uuid !== selectedTeam){
                return;
            }

            if(selectedPlayers.size){

                let lineup;

                if(a.home_team_uuid === selectedTeam){

                    lineup = [
                        a.home_player_1_uuid,
                        a.home_player_2_uuid,
                        a.home_player_3_uuid
                    ];

                }else{

                    lineup = [
                        a.away_player_1_uuid,
                        a.away_player_2_uuid,
                        a.away_player_3_uuid
                    ];
                }

                if(![...selectedPlayers].every(p => lineup.includes(p))){
                    return;
                }
            }
        }

        else if(rankingFilter === "rivalData"){

            if(a.action_team_uuid === selectedTeam){
                return;
            }
        }

        else if(rankingFilter === "oppData"){

            if(a.action_team_uuid === selectedTeam){
                return;
            }

            if(selectedPlayers.size){

                let lineup;

                if(a.home_team_uuid === selectedTeam){

                    lineup = [
                        a.home_player_1_uuid,
                        a.home_player_2_uuid,
                        a.home_player_3_uuid
                    ];

                }else{

                    lineup = [
                        a.away_player_1_uuid,
                        a.away_player_2_uuid,
                        a.away_player_3_uuid
                    ];
                }

                if(![...selectedPlayers].every(p => lineup.includes(p))){
                    return;
                }
            }
        }


        const playerUuid = a.action_player_uuid;
        const type = a.action_type;


        // Crear jugador
        if(!playerStats[playerUuid]){

            playerStats[playerUuid] = {
                playerUuid,
                playerName: a.action_player_name,
                totalShots: 0,
                types: {}
            };
        }


        const player = playerStats[playerUuid];


        // Crear tipus de tir
        if(!player.types[type]){

            player.types[type] = {
                attempts: 0,
                turnovers: 0,
                points: 0
            };
        }


        const stats = player.types[type];


        // Pèrdua
        if(a.action_result === "TO"){

            stats.turnovers++;

        }

        // Tir
        else{

            stats.attempts++;
            player.totalShots++;

            stats.points += getPoints(a.action_result);
        }

    });


    // Calcular mètriques
    Object.values(playerStats).forEach(player => {

        Object.values(player.types).forEach(stats => {

            stats.usage = player.totalShots
                ? stats.attempts / player.totalShots
                : 0;

            stats.ppa = stats.attempts
                ? stats.points / stats.attempts
                : 0;

            stats.tov =
                (stats.attempts + stats.turnovers)
                    ? stats.turnovers /
                      (stats.attempts + stats.turnovers)
                    : 0;
        });

    });


    return playerStats;
}

function renderShotChart(teamData, filteredData){

	const svg = document.getElementById("shotChart");
	svg.innerHTML="";

	if (!chartWidth) {
		chartWidth = document.getElementById("shotChartWrapper").clientWidth;
	}

	const width = chartWidth;

	const baselineTop = 260;
	const baselineBottom = 260;

	const maxHeight = 180;
	const maxPPA = 2.0;

	const topY = 10;
	const topHeight = 12;

	const orderedTeamData = SHOT_ORDER.map(type => teamData.find(x=>x.type===type) || {type, attempts:0, points:0, usage:0, ppa:0, tov:0});

	const orderedFilteredData = SHOT_ORDER.map(type => filteredData.find(x=>x.type===type) || {type, attempts:0, points:0, usage:0, ppa:0, tov:0});

	function drawChart(data, baseline, direction){

		let currentX = 0;
		let distX = 0;

		data.forEach(s=>{
			const distW = s.usage * width;
			const distRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");

			distRect.setAttribute("x", distX);
		
			if(direction==="up"){
				distRect.setAttribute("y", 35);
			}else{
				distRect.setAttribute("y", 473);
			}

			distRect.setAttribute("width", distW);
			distRect.setAttribute("height", 12);
			distRect.setAttribute("fill", SHOT_COLORS[s.type] || "#1976d2");

			if(selectedShotType === s.type){
				distRect.setAttribute("stroke", "#1976d2");
				distRect.setAttribute("stroke-width", "4");
			}else{
				distRect.setAttribute("stroke", "white");
				distRect.setAttribute("stroke-width", "1");
			}

			distRect.style.cursor="pointer";

			distRect.onclick=()=>{
				if(selectedShotType===s.type){
					selectedShotType=null;
				}else{
					selectedShotType=s.type;
				}

				renderRankings();
				renderShotLegend();
			};

			svg.appendChild(distRect);

			const w = s.usage * width;
			const h = s.ppa/maxPPA*maxHeight;

			const x = currentX;

			const color = SHOT_COLORS[s.type] || "#1976d2";
			const textColor = getContrastColor(color);


			let y;

			if(direction==="up"){
				y = baseline-h;
			}else{
				y = baseline;
			}

			const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");

			rect.setAttribute("x",x);
			rect.setAttribute("y",y);
			rect.setAttribute("width",w);
			rect.setAttribute("height", h);
			rect.setAttribute("fill",color);


			if(selectedShotType===s.type){
				rect.setAttribute("stroke","#1976d2");
				rect.setAttribute("stroke-width","4");
			}else{
				rect.setAttribute("stroke","white");
				rect.setAttribute("stroke-width","1");
			}


			rect.style.cursor="pointer";


			rect.onclick=()=>{

				if(selectedShotType===s.type){
					selectedShotType=null;
				}else{
					selectedShotType=s.type;
				}

				renderRankings();
				renderShotLegend();
			};



			rect.onmousemove=e=>{

				const tooltip=document.getElementById("shotTooltip");

				tooltip.style.display="block";
				tooltip.style.left=(e.clientX+15)+"px";
				tooltip.style.top=(e.clientY+15)+"px";

				tooltip.innerHTML=`
					<b>${s.type}</b><br>
					${(s.usage*100).toFixed(1)}% dels tirs<br>
					${s.ppa.toFixed(2)} punts / tir<br>
					${s.points} punts<br>
					${(s.tov*100).toFixed(1)}% pèrdues
				`;
			};


			rect.onmouseleave=()=>{
				document.getElementById("shotTooltip").style.display="none";
			};


			svg.appendChild(rect);



			// TEXT
			if(w >= 35){
				const usageTxt = (s.usage * 100).toFixed(1) + "%";
				const ppaTxt = s.ppa.toFixed(2) + " ppt";
				const ptsTxt = s.points + " pts";

				const FONT_SIZE = 13;
				const LINE_HEIGHT = 16;

				const text = document.createElementNS("http://www.w3.org/2000/svg", "text");

				text.setAttribute("font-size", FONT_SIZE);
				text.setAttribute("font-weight", "700");
				text.setAttribute("text-anchor", "middle");


				function fits(line){

					text.innerHTML="";

					const t = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
					t.textContent=line;
					text.appendChild(t);	

					svg.appendChild(text);

					const result = text.getComputedTextLength() <= w - 8;

					svg.removeChild(text);

					return result;
				}	

				let lines = null;

				// 1 línia
				if(fits(`${usageTxt} · ${ppaTxt} · ${ptsTxt}`)){
					lines = [`${usageTxt} · ${ppaTxt} · ${ptsTxt}`];
				}
				// 2 línies
				else if(fits(`${usageTxt} · ${ppaTxt}`) && fits(ptsTxt)){
					lines = [`${usageTxt} · ${ppaTxt}`, ptsTxt];
				}
				// 3 línies
				else if(fits(usageTxt) && fits(ppaTxt) && fits(ptsTxt)){
					lines = [usageTxt, ppaTxt, ptsTxt];
				}

				// Si no hi cap per amplada, no posem res
				if(lines){
					const totalHeight = (lines.length-1)*LINE_HEIGHT;
					
					let startY;

					if(direction==="up"){
						// dins de la barra
						if(h >= totalHeight + 16){
							startY = y + h/2 - totalHeight/2;
							text.setAttribute("fill",textColor);
						}
						// sobre la barra
						else{
							startY = y - 8 - totalHeight;
							text.setAttribute("fill","#333");
						}
					}else{
						// dins de la barra
						if(h >= totalHeight + 16){
							startY = y + h/2 - totalHeight/2 + 5;
							text.setAttribute("fill",textColor);
						}
						// sota la barra
						else{
							startY = y + h + 18;
							text.setAttribute("fill","#333");
						}

					}


					lines.forEach((line,i)=>{
						const t = document.createElementNS("http://www.w3.org/2000/svg", "tspan");
						t.setAttribute("x", x+w/2);
						t.setAttribute("y", startY+i*LINE_HEIGHT);
						t.textContent=line;
	
						text.appendChild(t);
					});
	
					svg.appendChild(text);
				}
			}
			currentX += w;
			distX += distW;
		});
	}

	// ETIQUETES

	const labelTop=document.createElementNS("http://www.w3.org/2000/svg", "text");

	labelTop.setAttribute("x",0);
	labelTop.setAttribute("y",20);
	labelTop.setAttribute("font-size","15");
	labelTop.setAttribute("font-weight","700");
	labelTop.setAttribute("fill","#555");
	labelTop.textContent="DATOS DE EQUIPO";

	svg.appendChild(labelTop);

	const labelBottom=document.createElementNS("http://www.w3.org/2000/svg", "text");

	labelBottom.setAttribute("x",0);
	labelBottom.setAttribute("y",525);
	labelBottom.setAttribute("font-size","15");
	labelBottom.setAttribute("font-weight","700");
	labelBottom.textContent=labelBottom.textContent=getFilteredLabel();
	labelBottom.setAttribute("fill","#555");
	svg.appendChild(labelBottom);

	// EIXOS
	const axis=document.createElementNS("http://www.w3.org/2000/svg", "line");
	axis.setAttribute("x1",0);
	axis.setAttribute("x2",width);
	axis.setAttribute("y1",baselineTop);
	axis.setAttribute("y2",baselineTop);
	axis.setAttribute("stroke","#444");
	axis.setAttribute("stroke-width","2");

	svg.appendChild(axis);

	const yTicks=[0.5,1,1.5,2];

	yTicks.forEach(value=>{

		const yTop = baselineTop - value/maxPPA*maxHeight;
		const yBottom = baselineBottom + value/maxPPA*maxHeight;
		[yTop, yBottom].forEach(y=>{

			const line=document.createElementNS("http://www.w3.org/2000/svg", "line");

			line.setAttribute("x1",0);
			line.setAttribute("x2",width);
			line.setAttribute("y1",y);
			line.setAttribute("y2",y);
			line.setAttribute("stroke","#ddd");
			line.setAttribute("stroke-dasharray","5 5");

			svg.appendChild(line);

		});

	});


	// DIBUIXAR ELS DOS GRÀFICS

	drawChart(orderedTeamData, baselineTop, "up");
	drawChart(orderedFilteredData, baselineBottom, "down");
	
	svg.setAttribute("viewBox", `0 0 ${width} 530`);
	svg.setAttribute("width", "100%");
	svg.setAttribute("preserveAspectRatio", "none");
}


function getContrastColor(hex){

    hex = hex.replace("#","");

    const r = parseInt(hex.substring(0,2),16);
    const g = parseInt(hex.substring(2,4),16);
    const b = parseInt(hex.substring(4,6),16);

    // luminància perceptual
    const luminance = 0.299*r + 0.587*g + 0.114*b;

    return luminance > 170 ? "#222" : "white";
}

async function loadData() {
	let query = supabase
		.from("actions")
		.select(`
        		*,
        		game:games!actions_game_uuid_fkey!inner(
            			game_date,
            			round,
            			home_team_uuid,
            			away_team_uuid,
            			home_team:teams!games_home_team_uuid_fkey(uuid, name),
            			away_team:teams!games_away_team_uuid_fkey(uuid, name),
            			competition:competitions!games_competition_uuid_fkey(name)
        		),
			team:teams!actions_team_uuid_fkey(uuid,	name),
		        player:players!actions_player_uuid_fkey(uuid, name, shirt_number),
		        home_lineup:lineups!actions_home_lineup_uuid_fkey(
            			player1:players!lineups_player_1_uuid_fkey(uuid,name),
            			player2:players!lineups_player_2_uuid_fkey(uuid,name),
            			player3:players!lineups_player_3_uuid_fkey(uuid,name)
        		),
        		away_lineup:lineups!actions_away_lineup_uuid_fkey(
            			player1:players!lineups_player_1_uuid_fkey(uuid,name),
				player2:players!lineups_player_2_uuid_fkey(uuid,name),
            			player3:players!lineups_player_3_uuid_fkey(uuid,name)
        		)
    		`)
		.or(`home_team_uuid.eq.${selectedTeam},away_team_uuid.eq.${selectedTeam}`, { foreignTable: "game" }
    	);

	const pageSize = 1000;
	let from = 0;
	let data = [];
	
	while (true) {
		const { data: page, error } = await query.range(from, from + pageSize - 1);

		if (error) {
			console.error(error);
			document.getElementById("status").innerText = "Error carregant dades";
        		return;
    		}

		data.push(...page);

		// Si s'han retornat menys de 1000 registres, ja hem acabat
		if (page.length < pageSize) break;
		from += pageSize;
	}

	const clean = data.map(r => ({
		...r,
		home_team_uuid: r.game?.home_team?.uuid,
    		home_team_name: r.game?.home_team?.name,
    		away_team_uuid: r.game?.away_team?.uuid,
    		away_team_name: r.game?.away_team?.name,
    		competition_name: r.game?.competition?.name,
    		game_date: r.game?.game_date,
    		action_team_uuid: r.team?.uuid,
    		action_team_name: r.team?.name,
    		action_player_uuid: r.player?.uuid,
    		action_player_name: r.player?.name,
    		home_player_1_uuid: r.home_lineup?.player1?.uuid,
    		home_player_1_name: r.home_lineup?.player1?.name,
    		home_player_2_uuid: r.home_lineup?.player2?.uuid,
    		home_player_2_name: r.home_lineup?.player2?.name,
    		home_player_3_uuid: r.home_lineup?.player3?.uuid,
    		home_player_3_name: r.home_lineup?.player3?.name,
    		away_player_1_uuid: r.away_lineup?.player1?.uuid,
    		away_player_1_name: r.away_lineup?.player1?.name,
    		away_player_2_uuid: r.away_lineup?.player2?.uuid,
    		away_player_2_name: r.away_lineup?.player2?.name,
    		away_player_3_uuid: r.away_lineup?.player3?.uuid,
    		away_player_3_name: r.away_lineup?.player3?.name,
    		round_block: r.game?.round === "1" || r.game?.round === "2" || r.game?.round === "3" ? "Grupos" : r.game?.round,
    		points: r.action_result === "1+" || r.action_result === "1+PF" || r.action_result === "FT+" ? 1 : (r.action_result === "2+" || r.action_result === "2+PF" ? 2 : 0)
  	}));

	currentActions = clean;

	if (!selectedTeam && teams.length > 0) selectedTeam = teams[0].uuid;
	await loadPlayers();

	renderCompetitionFilters();
	renderRoundFilters();
	refreshCurrentView();
	updateActionButtons();

	document.getElementById("allActions").onclick = () => {
		transitionFilter = "all";
    		updateActionButtons();
refreshCurrentView();
	};

	document.getElementById("onlyCheckballs").onclick = () => {
		transitionFilter = "check";
		updateActionButtons();
refreshCurrentView();
	};

	document.getElementById("onlyTrans").onclick = () => {
		transitionFilter = "nocheck";
    		updateActionButtons();
refreshCurrentView();
	};

	updateActionButtons();
}


async function loadPlayers(){

	const {data,error}=await supabase
        	.from("players")
        	.select("*")
        	.eq("team_uuid",selectedTeam)
        	.order("shirt_number");

	if(error){
        	console.error(error);
        	return;
    	}

	currentPlayers = data;
	renderPlayerCards(currentPlayers);
}


function getPoints(result){

	switch(result){
		case "1+":
        	case "1+PF":
        	case "FT+":
        		return 1;

	        case "2+":
        	case "2+PF":
            		return 2;

	        default:
        		return 0;

	}
}


function getPlayerCardStats(playerUuid, filtered = false){

    // Accions a utilitzar
    let actions = filtered ? getFilteredActions() : currentActions;

    // Només accions del nostre equip
    actions = actions.filter(a =>
        a.action_team_uuid === selectedTeam &&
        a.action_type &&
        !a.action_type.startsWith("REBOUND") &&
        !a.action_type.startsWith("FOUL") &&
        !a.action_type.startsWith("FREE THROW")
    );

    // Només s'aplica el filtre de checkball
    if(filtered){

        if(transitionFilter === "check"){
            actions = actions.filter(a => a.checkball == 1);
        }

        if(transitionFilter === "nocheck"){
            actions = actions.filter(a => a.checkball == 0);
        }
    }

    // Partits jugats
    const games = new Set(
        actions
            .filter(a => a.action_player_uuid === playerUuid)
            .map(a => a.game_uuid)
    ).size;

    // Punts
    const points = actions
        .filter(a => a.action_player_uuid === playerUuid)
        .reduce((x,a)=>x+(a.points ?? 0),0);

    // Accions amb el jugador a pista
    const onCourt = actions.filter(a=>{

        if(a.home_team_uuid === selectedTeam){
            return a.home_player_1_uuid === playerUuid ||
                   a.home_player_2_uuid === playerUuid ||
                   a.home_player_3_uuid === playerUuid;
        }

        return a.away_player_1_uuid === playerUuid ||
               a.away_player_2_uuid === playerUuid ||
               a.away_player_3_uuid === playerUuid;
    });

    // Tirs del jugador
    const playerShots = onCourt.filter(a=>a.action_player_uuid===playerUuid).length;

    return{

        games,

        ppg: games ? (points/games).toFixed(1) : "0.0",

        usage: onCourt.length
            ? (100*playerShots/onCourt.length).toFixed(1)
            : "0.0"

    };
}

function calculateShotStats(actions, applyShotFilter=true, applyPlayerFilters=true){

	const playerStats = {};
    	const shotStats = {};

	const totalGames = new Set(actions.map(a => a.game_uuid)).size;

	actions.forEach(a=>{
		if(applyShotFilter && selectedShotType && a.action_type !== selectedShotType) return;
		if(!a.action_type) return;
		if(!a.action_player_name) return;
		if(a.action_type.includes("REBOUND")) return;
        	if(a.action_type.includes("FOUL")) return;
        	if(a.action_type.includes("FREE THROW")) return;
	        if(transitionFilter==="check" && a.checkball!=1) return;
		if(transitionFilter==="nocheck" && a.checkball!=0) return;

		// ---------------- FILTRES DE JUGADOR ----------------
				if(applyPlayerFilters){

			// ============================
			// DATOS DE JUGADOR
			// ============================
			if(rankingFilter === "playerData"){

				// només accions del nostre equip
				if(a.action_team_uuid !== selectedTeam){
					return;
				}

				// si hi ha jugadors seleccionats, només els seus tirs
				if(selectedPlayers.size &&
				   !selectedPlayers.has(a.action_player_uuid)){
					return;
				}
			}

			// ============================
			// DATOS DE EQUIPO
			// ============================
			else if(rankingFilter === "teamData"){

				// només accions del nostre equip
				if(a.action_team_uuid !== selectedTeam){
					return;
				}

				if(selectedPlayers.size){

					let lineup;

					if(a.home_team_uuid === selectedTeam){
						lineup = [
							a.home_player_1_uuid,
							a.home_player_2_uuid,
							a.home_player_3_uuid
						];
					}else{
						lineup = [
							a.away_player_1_uuid,
							a.away_player_2_uuid,
							a.away_player_3_uuid
						];
					}

					if(![...selectedPlayers].every(p => lineup.includes(p))){
						return;
					}
				}
			}

			// ============================
			// RIVAL
			// ============================
			else if(rankingFilter === "rivalData"){

				// només accions del rival
				if(a.action_team_uuid === selectedTeam){
					return;
				}
			}

			// ============================
			// RIVAL CON JUGADOR EN PISTA
			// ============================
			else if(rankingFilter === "oppData"){

				// només accions del rival
				if(a.action_team_uuid === selectedTeam){
					return;
				}

				if(selectedPlayers.size){

					let lineup;

					// alineació del nostre equip
					if(a.home_team_uuid === selectedTeam){
						lineup = [
							a.home_player_1_uuid,
							a.home_player_2_uuid,
							a.home_player_3_uuid
						];
					}else{
						lineup = [
							a.away_player_1_uuid,
							a.away_player_2_uuid,
							a.away_player_3_uuid
						];
					}

					if(![...selectedPlayers].every(p => lineup.includes(p))){
						return;
					}
				}
			}
		}

	        let type = a.action_type;
	        const playerKey = a.action_player_name + "|||" + type;

	        if(!playerStats[playerKey]){
			playerStats[playerKey]={player:a.action_player_name, type, attempts:0, turnovers:0, points:0};
		}
		
		if(!shotStats[type]){
			shotStats[type]={type, attempts:0, turnovers:0, points:0};
		}

		const p = playerStats[playerKey];
        	const s = shotStats[type];

		if(a.action_result==="TO"){
			p.turnovers++;
			s.turnovers++;
		}else{
			p.attempts++;
            		s.attempts++;
		}
	
		const pts = getPoints(a.action_result);	
		p.points += pts;
        	s.points += pts;
	});

    	const playerValues = Object.values(playerStats);
	const totalAttempts = playerValues.reduce((x,y)=>x+y.attempts,0);

	playerValues.forEach(v=>{
		v.usage = totalAttempts ? v.attempts/totalAttempts : 0;
		v.ppa = v.attempts ? v.points/v.attempts : 0;
		v.tov = v.attempts+v.turnovers ? v.turnovers/(v.attempts+v.turnovers) : 0;
		v.attemptsPerGame = totalGames ? v.attempts/totalGames : 0;
		v.rankTotal = v.usage*v.ppa;
	});

	const usage = [...playerValues].sort((a,b)=>b.usage-a.usage);
	const efficiency = [...playerValues].filter(v => selectedShotType || selectedPlayers.size>0 || transitionFilter!=="all" || v.attemptsPerGame>=1).sort((a,b)=>b.ppa-a.ppa);
	const combined = [...playerValues].filter(v => selectedShotType || selectedPlayers.size>0 || transitionFilter!=="all" || v.attemptsPerGame>=1).sort((a,b)=>b.rankTotal-a.rankTotal);
	
	const shotValues = Object.values(shotStats);
	const totalShotAttempts = shotValues.reduce((x,y)=>x+y.attempts,0);
	
	shotValues.forEach(v=>{
		v.usage = totalShotAttempts ? v.attempts/totalShotAttempts : 0;
		v.ppa = v.attempts ? v.points/v.attempts : 0;
		v.tov = v.attempts+v.turnovers ? v.turnovers/(v.attempts+v.turnovers) : 0;
	});

	return {usage, efficiency, combined, shotTypes:shotValues};
}

	const buttons = {

		rivalData:"rivalData",

	Object.entries(buttons).forEach(([id,value])=>{

}


function getFilteredLabel(){

	const parts = [];

	if(document.getElementById("playerData").classList.contains("active")){
		parts.push("Jugador");
	}

	if(document.getElementById("teamData").classList.contains("active")){
		parts.push("Equipo con jugador en pista");
	}

	if(document.getElementById("oppData").classList.contains("active")){
		parts.push("Rival con jugador en pista");
	}

	if(document.getElementById("rivalData")?.classList.contains("active")){
		return "DATOS FILTRADOS: Rival";
	}

	let txt = "DATOS FILTRADOS";

	if(parts.length){
		txt += ": " + parts.join(" + ");
	}

	if(selectedPlayers.size){

		if(selectedPlayers.size === currentPlayers.length){
			txt += " (todos)";
		}else{
			const names = currentPlayers
				.filter(p => selectedPlayers.has(p.uuid))
				.map(p => p.name);

			txt += " (" + names.join(", ") + ")";
		}

	}else{
		txt += " (todos)";
	}

	return txt;
}


function renderRankings(){


	const allActions = currentActions;

	const actions = getFilteredActions();

	// dades completes sempre pel gràfic
	// gràfic superior: sempre equip complet
const teamChartStats = calculateShotStats(
	allActions.filter(a => a.action_team_uuid === selectedTeam),
	false,
	false
);

	// gràfic inferior: només filtres de jugador/competició/ronda
	const filteredChartStats = calculateShotStats(actions, false, true);

	renderShotChart(teamChartStats.shotTypes, filteredChartStats.shotTypes);

	// rankings sí que utilitzen selecció de tipus de tir
	const rankings = calculateShotStats(actions, true, true);

	let attempts = 0;
	let points = 0;

	actions.forEach(a => {
		if(!a.action_type) return;
		if(a.action_type.startsWith("REBOUND")) return;
		if(a.action_type.startsWith("FOUL")) return;
		if(a.action_result.startsWith("TO")) return;

		if(transitionFilter === "check" && a.checkball != 1) return;
		if(transitionFilter === "nocheck" && a.checkball != 0) return;

		if(a.action_team_uuid !== selectedTeam) return;

		points += getPoints(a.action_result);
		attempts++;
	});

	const teamEfficiency = attempts ? points / attempts : 0;

	const container = document.getElementById("rankings");
	container.innerHTML="";

	if(rankingFilter === "rivalData" || rankingFilter === "oppData"){
    container.innerHTML = "";
    return;
}

	createColumn(container, "TOP USAGE", rankings.usage, x=>(x.usage*100).toFixed(1)+" %");
	createColumn(container, "TOP EFICIENCIA", rankings.efficiency, x=>x.ppa.toFixed(2)+" pts/acc");
	createColumn(container, "TOP COMBINADO", rankings.combined, x=>"Score: "+x.rankTotal);
}


function createColumn(container,title,data,valueFunction,extraText=""){

	const col=document.createElement("div");
	col.className="ranking-column";
	col.innerHTML = `
		<div class="ranking-title-row">
    			<div class="ranking-title">${title}</div>
			${extraText ? `<div class="ranking-extra">${extraText}</div>` : ""}
		</div>		
	`;

	data.slice(0,5).forEach((row,index)=>{
		const card=document.createElement("div");
		card.className="rank-card";
		const rankKey = row.player + "|||" + row.type;
		card.dataset.rankKey = rankKey;
		card.dataset.player = row.player;
		card.dataset.type = row.type;

        	card.innerHTML = `
			<div class="rank-position">${index + 1}</div>
			<div class="rank-info">
				<div class="rank-player">${row.player}</div>
				<div class="rank-shot">${row.type}</div>
				<div class="rank-stats">USG ${(row.usage*100).toFixed(1)}% · ${row.ppa.toFixed(2)} pts/acc · TO% ${(row.tov*100).toFixed(1)}%</div>
			</div>
		`;

		card.onmouseenter = () => {
			if(!lockedRankKey) highlightRankCards(rankKey);
		};

		card.onmouseleave = () => {
			if(!lockedRankKey) clearRankCards();
		};

		card.onclick = () => {
			if(lockedRankKey === rankKey){
				lockedRankKey = null;
        			clearRankCards();
			}else{
				lockedRankKey = rankKey;
        			highlightRankCards(rankKey);
			}
		};

		col.appendChild(card);
    });

    container.appendChild(col);
}


function highlightRankCards(key){
	document.querySelectorAll(".rank-card").forEach(card=>{card.classList.toggle("highlight",card.dataset.rankKey === key);});
}


function clearRankCards(){
	document.querySelectorAll(".rank-card").forEach(c=>c.classList.remove("highlight"));
}


function highlightCards(player, type, active){
	document.querySelectorAll(".rank-card").forEach(card=>{
		const same = card.dataset.player === player && card.dataset.type === type;
		card.classList.toggle("linked", active && same);
	});
}
